<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18100f">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<audio id="bgm" src="assets/music.mp3" loop preload="auto"></audio>
<canvas id="petals"></canvas>

<!-- Top controls: language + music -->
<div class="controls">
  <button class="pill" id="langBtn" type="button">عربي</button>
  <button class="pill" id="musicBtn" type="button" aria-label="Toggle music">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
  </button>
</div>

<!-- ENVELOPE SCENE -->
<div class="scene" id="scene">
  <div class="envelope">
    <div class="env-back"></div>
    <div class="letter">
      <div class="l-names" id="letterNames"></div>
      <div class="l-sub" data-i18n="letterSub"></div>
    </div>
    <div class="env-front"></div>
    <div class="flap"></div>
    <button class="seal" id="seal" type="button" aria-label="Open invitation"><span id="sealInit"></span></button>
  </div>
  <p class="scene-title" data-i18n="exclusive"></p>
  <p class="tap" data-i18n="tap"></p>
</div>

<!-- INVITATION -->
<main>
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-in">
      <p class="bsm stg" style="--i:0" data-i18n="bsm"></p>
      <p class="eyebrow stg" style="--i:0" data-i18n="eyebrow"></p>
      <h1 class="names stg" style="--i:1"><span id="gName"></span><span class="amp">&amp;</span><span id="bName"></span></h1>
      <p class="invite stg" style="--i:2" data-i18n="invite"></p>
      <div class="hero-date stg" style="--i:3" id="heroDate"></div>
      <div class="hero-place stg" style="--i:4" id="heroPlace"></div>
    </div>
    <div class="scroll-cue" aria-hidden="true"></div>
  </header>

  <section class="sec paper rv">
    <h2 data-i18n="eventsTitle"></h2>
    <p class="sub" data-i18n="eventsSub"></p>
    <div class="events" id="events"></div>
  </section>

  <section class="sec rv">
    <h2 data-i18n="countTitle"></h2>
    <div class="count" id="count"></div>
  </section>

  <section class="sec paper rv">
    <h2 data-i18n="programTitle"></h2>
    <p class="sub" data-i18n="programSub"></p>
    <div class="program" id="program"></div>
  </section>

  <section class="sec rv">
    <h2 data-i18n="venueTitle"></h2>
    <p class="sub" data-i18n="venueSub"></p>
    <p class="venue-name" id="venueName"></p>
    <p class="sub" id="venueCity"></p>
    <p class="sub" id="venueAddr"></p>
    <div class="map" id="mapBox"><iframe id="mapFrame" loading="lazy" allowfullscreen title="Map" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
  </section>

  <section class="sec rsvp-bg rv">
  <svg class="rings" viewBox="0 0 64 44" aria-hidden="true"><circle cx="24" cy="27" r="13"/><circle cx="40" cy="27" r="13"/><path d="M24 4l4.5 4.5L24 13l-4.5-4.5z"/></svg>
  <div class="bless">
    <span class="orn" aria-hidden="true">❦</span>
    <p class="bless-t" data-i18n="blessText"></p>
    <span class="orn" aria-hidden="true">❦</span>
  </div>
  <div class="rsvp">
    
    <a class="btn " id="calBtn" target="_blank" rel="noopener" data-i18n="addCal"></a>
  </div>
</section>

  <footer>
    <p class="thanks" data-i18n="thanks"></p>
  </footer>
</main>

<script src="script.js"></script>
</body>
</html>
